[project]
name = "todo-app"
version = "0.1.0"
description = "Django Todo App"
readme = "README.md"
requires-python = ">=3.12"  # Fixed: use >=3.12 or >=3.13
dependencies = [
    "django>=5.1",
    "djangorestframework>=3.15.0",
    "dotenv>=0.9.9",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.4",
]

[tool.setuptools]
packages = ["config"]  # Your Django project name
py-modules = ["manage"]
